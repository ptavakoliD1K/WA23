<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gruppenchat</title>
    <!-- Dein Header-CSS -->
    <link rel="stylesheet" th:href="@{/css/headerResponsive.css}">
    <!-- Dein Chat-CSS (unverändert von dir) -->
    <link rel="stylesheet" th:href="@{/css/groupChat.css}">
    <link rel="stylesheet" th:href="@{/css/footerResponsive.css}">

    <!-- Boxicons (Icons) -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>

<!-- Dein Header -->
<header id="responsive-header">
    <nav>
        <!-- Hier wird dein Header-Fragment eingefügt -->
        <div th:insert="fragments/headerResponsive.html"></div>
    </nav>
</header>

<!-- Hauptcontainer für den Chat -->
<main id="chatMainContainer">
    <!-- Linke Spalte: Sidebar -->
    <section class="groupSidebar">
        <div class="sidebarHeader">
            <h2>Deine Chats</h2>
            <button class="createGroupBtn" onclick="openCreateGroupModal()">
                <i class='bx bx-plus'></i>
            </button>            <div class="groupSearch">
            <input type="text" placeholder="Suchen...">
            <i class='bx bx-search'></i>
        </div>
        </div>
        <div class="groupList">
            <div
                    class="groupItem"
                    th:each="room : ${chatRooms}"
                    th:id="'chatRoom_' + ${room.id}"
                    th:attr="data-id=${room.id}, data-name=${room.name}"
                    onclick="onRoomClicked(this)">
                <div class="groupName" th:text="${room.name}"></div>
            </div>
        </div>
    </section>

    <!-- Rechte Spalte: Chatbereich -->
    <section class="chatArea">
        <div class="chatHeader">
            <h2 class="chatTitle" id="currentChatTitle">Bitte wähle einen Chat</h2>
            <div class="chatHeaderIcons">
                <i class='bx bx-user-plus' title="Nutzer hinzufügen" onclick="openAddUsersModal()"></i>
                <i class='bx bx-cog' title="Einstellungen"></i>
            </div>
        </div>
        <div class="chatMessages" id="chatMessagesContainer"></div>
        <div class="chatInput">
            <input type="text" id="messageInput" placeholder="Nachricht eingeben..." disabled>
            <button type="button" id="sendMessageBtn" onclick="sendMessage()" disabled>Senden</button>
        </div>
    </section>
</main>

<!-- MODAL: Nutzer zu Gruppe hinzufügen -->
<div id="addUsersModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="closeAddUsersModal()">&times;</span>
        <h2>Nutzer zu Gruppe hinzufügen</h2>

        <div class="Groupname">
            <h4>Mitglieder auswählen</h4>
            <div id="addUsersCheckboxList" class="checkbox-container"></div>
        </div>

        <button type="button" class="button" onclick="submitAddUsers()">Hinzufügen</button>
    </div>
</div>


<div id="createGroupModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="closeCreateGroupModal()">&times;</span>
        <p class="GruppeTitel">Neue Gruppe erstellen</p>

        <div class="Groupname">
            <label for="groupNameInput" class="label">Gib deiner Gruppe einen Namen: </label>
            <input type="text" id="groupNameInput" class="groupNameInput" placeholder="z.B. Projektteam A">
        </div>

        <div class="Groupname">
            <p style="margin:5px 0px;"> <strong>Mitglieder auswählen </strong></p>
            <!-- Hier laden wir per JS die Liste aller User (Checkboxen) -->
            <div id="groupUsersCheckboxList"></div>
        </div>

        <button type="button" class="button" onclick="createGroup()">Gruppe erstellen</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.0/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
    /* =========================================================
       GLOBALE VARIABLEN
       ========================================================= */
    let stompClient = null;
    let currentChatRoomId = null;
    let currentChatRoomName = null;

    /* =========================================================
       KLICK AUF EINE GRUPPE
       ========================================================= */
    function onRoomClicked(element) {
        // Lies ChatRoom-ID & -Name aus data-Attributen
        const chatRoomId = element.dataset.id;
        const chatRoomName = element.dataset.name;

        // Dann ruf die schon vorhandene selectChatRoom-Funktion
        selectChatRoom(chatRoomId, chatRoomName);
    }
    function loadAllUsersForGroup() {
    fetch('/chat/users')
        .then(response => response.json())
        .then(users => {
            // Optional: eigenen User filtern
            // Hier nimmst du den eingeloggten User, falls du ihn NICHT auswählen willst
            const loggedInUsername = /*[[${#authentication.principal.username}]]*/ 'Du';
            const filteredUsers = users.filter(u => u.username !== loggedInUsername);

            const container = document.getElementById('groupUsersCheckboxList');
            filteredUsers.forEach(user => {
                const label = document.createElement('label');
                label.style.display = 'block'; // Jede Zeile

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = user.username; // Username
                // kein name="usernames" nötig, wir sammeln das in JS

                label.appendChild(checkbox);
                label.append(' ' + user.username);
                container.appendChild(label);
            });
        })
        .catch(error => console.error("Fehler beim Laden der Benutzer:", error));
    }

    function openCreateGroupModal() {

    console.log("openCreateGroupModal aufgerufen!");

    document.getElementById('groupNameInput').value = '';
    document.getElementById('groupUsersCheckboxList').innerHTML = '';

    // Modal anzeigen
    document.getElementById('createGroupModal').style.display = 'block';

    // User-Liste laden und als Checkboxen einfügen
    loadAllUsersForGroup();
    }

    function closeCreateGroupModal() {
    document.getElementById('createGroupModal').style.display = 'none';
    }

    function createGroup() {
    const groupName = document.getElementById('groupNameInput').value.trim();
    if (!groupName) {
        alert("Bitte Gruppenname eingeben.");
        return;
    }

    // Checkboxen sammeln
    const checkboxes = document.querySelectorAll('#groupUsersCheckboxList input[type="checkbox"]:checked');
    const selectedUsernames = Array.from(checkboxes).map(cb => cb.value);

    // FormData erstellen, da dein Controller @RequestParam nutzt
    const formData = new FormData();
    formData.append("name", groupName);
    selectedUsernames.forEach(username => {
        formData.append("usernames", username);
    });

    fetch('/chat/group', {
        method: 'POST',
        body: formData
    })
    .then(response => {
        if (response.redirected) {
            // Erwarte: return "redirect:/chat"
            window.location.href = response.url;
        } else {
            // falls kein Redirect
            return response.text();
        }
    })
    .then(() => {
        // Modal schließen
        closeCreateGroupModal();
        // optional: location.reload();
    })
    .catch(error => {
        console.error("Fehler beim Erstellen der Gruppe:", error);
        alert("Fehler: " + error);
    });
    }
    /* =========================================================
       CHATRAUM ÖFFNEN
       ========================================================= */
    function selectChatRoom(chatRoomId, chatRoomName) {
        currentChatRoomId = chatRoomId;
        currentChatRoomName = chatRoomName;

        // Titel im Chat aktualisieren
        document.getElementById('currentChatTitle').innerText = chatRoomName;

        // Eingabefelder aktivieren
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendMessageBtn').disabled = false;

        // Nachrichtenliste leeren
        const messagesContainer = document.getElementById('chatMessagesContainer');
        messagesContainer.innerHTML = '';

        // Vorhandene Nachrichten via REST laden
        fetchMessages(chatRoomId);

        // WebSocket-Abo aktualisieren
        subscribeToChatRoom(chatRoomId);
    }

    /* =========================================================
       NACHRICHTEN PER REST LADEN
       ========================================================= */
    function fetchMessages(chatRoomId) {
        fetch('/chat/' + chatRoomId + '/messages')
            .then(response => response.json())
            .then(data => {
                // Array von MessageDTO
                data.forEach(msg => {
                    addMessageToChat(msg);
                });
            })
            .catch(error => console.error('Error fetching messages:', error));
    }

    /* =========================================================
       NACHRICHT SENDEN
       ========================================================= */
    function sendMessage() {
        if (!currentChatRoomId) return;
        const messageInput = document.getElementById('messageInput');
        const content = messageInput.value.trim();
        if (content !== '') {
            // Baue MessageDTO-ähnliches Objekt
            const msg = { content: content };
            // /app/chat/{chatRoomId} -> @MessageMapping("/chat/{chatRoomId}")
            stompClient.send("/app/chat/" + currentChatRoomId, {}, JSON.stringify(msg));
            messageInput.value = '';
        }
    }

    /* =========================================================
       NEUE NACHRICHT IM UI ANZEIGEN
       ========================================================= */
    function addMessageToChat(messageDTO) {
        // messageDTO = { id, content, username, chatRoomId, chatRoomName, createdAt }
        const container = document.getElementById('chatMessagesContainer');

        const loggedInUsername = /*[[${#authentication.principal.username}]]*/ 'Du'; // Fallback

        console.log("Sender:", messageDTO.username,
                "LoggedIn:", loggedInUsername);


        const msgClass = (messageDTO.username === loggedInUsername)
            ? 'message outgoing'
            : 'message incoming';

        // Container für eine Nachricht
        const wrapperDiv = document.createElement('div');
        wrapperDiv.className = msgClass;

        // Sender
        const senderSpan = document.createElement('span');
        senderSpan.className = 'senderName';
        senderSpan.textContent = messageDTO.username;

        // Inhalt
        const textDiv = document.createElement('div');
        textDiv.className = 'textBubble';
        textDiv.textContent = messageDTO.content;

        // Zeitstempel
        const timestampSpan = document.createElement('span');
        timestampSpan.className = 'timestamp';
        const date = new Date(messageDTO.createdAt);
        timestampSpan.textContent = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        wrapperDiv.appendChild(senderSpan);
        wrapperDiv.appendChild(textDiv);
        wrapperDiv.appendChild(timestampSpan);
        container.appendChild(wrapperDiv);

        // Scroll nach unten
        container.scrollTop = container.scrollHeight;
    }

    /* =========================================================
       CHATRAUM PER WEBSOCKET ABONNIEREN
       ========================================================= */
   let currentSubscription = null;

function subscribeToChatRoom(chatRoomId) {
    // Falls noch ein altes Subscription-Objekt existiert, unsubscriben
    if (currentSubscription) {
        currentSubscription.unsubscribe();
        currentSubscription = null;
    }

    // Neu subscriben und das Objekt aufbewahren
    currentSubscription = stompClient.subscribe('/topic/messages/' + chatRoomId, (message) => {
        const msgDTO = JSON.parse(message.body);
        addMessageToChat(msgDTO);
    });
}

    /* =========================================================
       NUTZER HINZUFÜGEN / MODAL
       ========================================================= */
    function openAddUsersModal() {
        const modal = document.getElementById('addUsersModal');
        if (!currentChatRoomId) {
            alert("Bitte zuerst einen Chat auswählen.");
            return;
        }
        modal.style.display = 'block';
    }

    function closeAddUsersModal() {
        document.getElementById('addUsersModal').style.display = 'none';
    }

    function submitAddUsers() {
        const usernames = document.getElementById('usernames').value.trim();
        if (!usernames) {
            alert("Bitte Usernamen eingeben.");
            return;
        }
        const userArray = usernames.split(',').map(u => u.trim());

        fetch('/chat/' + currentChatRoomId + '/addUsers', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': '[[${_csrf.token}]]'
            },
            body: JSON.stringify({ usernames: userArray })
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                return response.text();
            }
        })
        .then(() => {
            closeAddUsersModal();
            alert("Nutzer wurden hinzugefügt!");
        })
        .catch(error => {
            console.error('Fehler beim Hinzufügen:', error);
            alert("Fehler beim Hinzufügen: " + error);
        });
    }

    /* =========================================================
       STOMP/WEBSOCKET-VERBINDUNG AUFBAUEN
       ========================================================= */
    function connectWebSocket() {
        var socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame) {
            console.log("Connected: " + frame);
            // subscription wird erst ausgelöst, wenn man einen Chat wählt
        });
    }

    /* =========================================================
       BEI SEITENAUFRUF
       ========================================================= */
    document.addEventListener("DOMContentLoaded", function() {
        connectWebSocket();
    });

       document.addEventListener("DOMContentLoaded", function() {
        const messageInput = document.getElementById('messageInput');

        // Event-Listener für "Enter" im Eingabefeld
        messageInput.addEventListener("keydown", function(e) {
            // Wenn Enter gedrückt wird ...
            if (e.key === 'Enter' || e.keyCode === 13) {
                e.preventDefault();      // Verhindert ggf. Zeilenumbruch/Submit
                sendMessage();          // Aufruf der existierenden Funktion
            }
        });

        connectWebSocket();  // War schon vorhanden
    });
</script>

<div th:insert="fragments/footerResponsive.html"></div>
</body>
</html>
