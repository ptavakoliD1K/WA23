<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Semester Übersicht</title>
    <link rel="stylesheet" th:href="@{/css/Semesteroverview.css}" />
</head>
<body>
<header>
    <nav class="navbar">
        <div class="navdiv">
            <div class="name">WelfenHUB - wenn Welfen helfen</div>
            <ul>
                <li><a th:href="@{/}" class="active">Startseite</a></li>
                <li><a th:href="@{/posts}">Forum</a></li>
                <li><a th:href="@{/news}">News</a></li>
                <li><a th:href="@{/feedback}">Feedback</a></li>
                <li><a th:href="@{/impressum}">Impressum</a></li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/AdminDashboard}" class="btn">Admin Dashboard</a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <button type="submit">Abmelden</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>
</header>
<div class="semester-overview-container">
    <!-- Zentrierter Titel -->
    <div class="semester-overview-header">
        <h1 th:text="${subject.equalsIgnoreCase('bwl') ? 'BWL' : (subject.equalsIgnoreCase('wirtschaftsinformatik') ? 'Wirtschaftsinformatik' : (subject.equalsIgnoreCase('sonstiges') ? 'Sonstiges' : #strings.capitalize(subject)))}"></h1>
    </div>


    <!-- Dynamische Anzeige für jedes Semester -->
    <div th:each="entry : ${coursesBySemester}">
        <!-- Zugriff auf Semester und Kurse -->
        <div class="semester-section">
            <h2 th:text="'Semester ' + ${entry.key}"></h2>
            <div class="course-list">
                <ul>
                    <li th:each="course : ${entry.value}">
                        <a th:href="@{/forum/{subject}/{semester}/course/{course}(subject=${subject}, semester=${entry.key}, course=${course})}"
                           th:text="${course}">Course Name</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<footer th:insert="fragments/footer :: footer"></footer>
</body>
</html>
