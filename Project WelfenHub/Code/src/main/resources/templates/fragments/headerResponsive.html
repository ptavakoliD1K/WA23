<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startseite</title>
    <link rel="stylesheet" th:href="@{/css/headerResponsive.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="navdiv">
            <a class="name" id="titleHeader" th:href="@{/}">
                   WelfenHUB - wenn Welfen helfen
            </a>
            <ul>
                <li><a th:href="@{/}" class="active">Startseite</a></li>
                <li><a th:href="@{/forum}">Forum</a></li>
                <li><a th:href="@{/news}">News</a></li>
                <li><a th:href="@{/feedback}">Feedback</a></li>
                <li><a th:href="@{/impressum}">Impressum</a></li>
                <button th:onclick="|window.location.href='@{/logout}'|">Abmelden</button>
            </ul>
            <div id="burgerMenu">
                <label for="toggleNav">
                    <div class="white"></div>
                    <div class="transparent"></div>
                    <div class="white"></div>
                    <div class="transparent"></div>
                    <div class="white"></div>
                </label>
            </div>
        </div>
    </nav>
    <input type="checkbox" id="toggleNav">
    <div class="navResponsive" id="navResp">
        <ul>
            <li><a th:href="@{/}" class="active">Startseite</a></li>
            <li><a th:href="@{/forum}">Forum</a></li>
            <li><a th:href="@{/news}">News</a></li>
            <li><a th:href="@{/feedback}">Feedback</a></li>
            <li><a th:href="@{/impressum}">Impressum</a></li>
            <button th:onclick="|window.location.href='@{/logout}'|">Abmelden</button>
        </ul>
    </div>
</header>
</body>
<script>
const headerTitle = document.getElementById('titleHeader');

function updateTitle() {
    if (window.innerWidth <= 1400 && window.innerWidth > 960) {
        headerTitle.innerHTML = "WelfenHUB"
    } else if (window.innerWidth <= 960 && window.innerWidth > 720) {
        headerTitle.innerHTML = "WelfenHUB - wenn Welfen helfen"
    } else if (window.innerWidth <= 720) {
        headerTitle.innerHTML = "WelfenHUB"
    }
}

addEventListener("resize", updateTitle)

updateTitle();

</script>
