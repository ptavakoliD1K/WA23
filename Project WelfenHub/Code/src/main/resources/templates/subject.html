<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Posts</title>
    <link rel="stylesheet" th:href="@{/css/subject.css}" />
    <meta name="_csrf" content="${_csrf.token}"/>
    <meta name="_csrf_header" content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/headerResponsive.css}">
    <link rel="stylesheet" th:href="@{/css/footerResponsive.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header id="responsive-header">
    <nav>
        <div th:insert="fragments/headerResponsive.html"></div>
    </nav>
</header>

<!-- Hauptcontainer für Sidebar und Content -->
<div class="content-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div th:each="entry : ${coursesBySemester}">
            <h3 th:text="'Semester ' + ${entry.key}"></h3>
            <ul>
                <li th:each="course : ${entry.value}">
                    <a th:href="@{/forum/{subject}/{semester}/course/{course}(subject=${subject}, semester=${entry.key}, course=${course})}"
                       th:text="${course}">Course Name</a>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Hauptinhalt -->
    <main class="main-content">
        <h1>Posts</h1>

        <!-- Suchleiste und Neuer Post Button -->
        <div class="action-buttons-container">
            <div class="search-container">
                <span class="search-icon" onclick="toggleSearch()">🔍</span>
                <a class="new-post-button" onclick="openModal()">+</a>
                <div id="searchBar" class="search-bar" style="display: none;">
                    <form th:action="@{/forum/{subject}/{semester}/course/{course}/search(subject=${subject}, semester=${semester}, course=${course})}" method="get">
                        <input type="text" name="query" placeholder="Search by Title..." required/>
                        <input type="hidden" name="subject" th:value="${subject}"/>
                        <input type="hidden" name="semester" th:value="${semester}"/>
                        <input type="hidden" name="course" th:value="${course}"/>
                        <button type="submit">Search</button>
                    </form>
                    <a th:href="@{/forum/{subject}/{semester}/course/{course}(subject=${subject}, semester=${semester}, course=${course})}" class="reset-search-button">Suche zurücksetzen</a>
                </div>
            </div>
        </div>

        <!-- Posts -->
        <div class="posts-list">
            <ul>
                <li th:each="post : ${posts}" class="post-item">
                    <h2 th:text="${post.title}">Post Title</h2>
                    <p th:text="${post.content}">Post Content</p>
                    <p>Posted by <span th:text="${post.user.username}">User</span> on <span th:text="${post.createdAt}">Date</span></p>
                    <button type="button" class="comment-toggle" onclick="toggleComments(this)">▼</button>
                    <div class="comments-section" style="display: none;">
                        <h3>Kommentare:</h3>
                        <ul>
                            <li th:each="comment : ${post.comments}">
                                <p th:text="${comment.user.username}">Comment User</p>
                                <p th:text="${comment.content}">Comment Content</p>
                                <p th:text="${comment.createdDate}">Comment Date</p>
                            </li>
                        </ul>
                        <div class="comment-form">
                            <form id="commentForm_${post.id}" onsubmit="postComment(event, ${post.id});" th:id="'commentForm_' + ${post.id}" th:onsubmit="'postComment(event, ' + ${post.id} + ');'">
                                <input type="hidden" name="postId" th:value="${post.id}" />
                                <label th:for="'comment-content-' + ${post.id}">Dein Kommentar:</label>
                                <textarea th:id="'comment-content-' + ${post.id}" name="content" rows="3" required></textarea>
                                <button type="submit">Kommentieren</button>
                                <p th:text="'Debug: ' + ${post.id}"></p>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </main>
</div>

<!-- Modal für neuen Post -->
<div id="newPostModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Neuen Post erstellen</h2>
        <form th:action="@{/posts/create}" method="post">
            <input type="hidden" name="subject" th:value="${subject}"/>
            <input type="hidden" name="semester" th:value="${semester}"/>
            <input type="hidden" name="course" th:value="${course}"/>

            <label>Title:</label>
            <input type="text" name="title" required/><br/>

            <label>Content:</label>
            <textarea name="content" required></textarea><br/>

            <button type="submit">Create Post</button>
        </form>
    </div>
</div>

<div th:insert="fragments/footerResponsive.html"></div>

<script src="/js/scriptAddComment.js"></script>
</body>
</html>
